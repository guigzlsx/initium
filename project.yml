name: Initium

options:
  bundleIdPrefix: com.guillaumelsx
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Initium:
    type: application
    platform: iOS
    sources:
      - path: Initium
    resources:
      - path: Initium/Resources
      - path: Initium/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumelsx.initium
        PRODUCT_NAME: Initium
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Initium/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Initium
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_NSCalendarsUsageDescription: "Initium lit ton calendrier pour t’aider à te préparer à temps."
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "Initium lit ton calendrier pour afficher tes événements et préparer tes transitions."
        # Optional public client configuration. Leave undefined to run fully offline.
        INFOPLIST_KEY_SUPABASE_URL: "$(SUPABASE_URL)"
        INFOPLIST_KEY_SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        SWIFT_EMIT_LOC_STRINGS: true
    scheme:
      testTargets:
        - InitiumTests

  InitiumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InitiumTests
    dependencies:
      - target: Initium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guillaumelsx.initiumtests
        GENERATE_INFOPLIST_FILE: YES
